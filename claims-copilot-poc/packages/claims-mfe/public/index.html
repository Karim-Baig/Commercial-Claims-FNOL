<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claims MFE &mdash; standalone dev harness</title>
    <style>
      *,*::before,*::after { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      body {
        font-family: "Segoe UI", Inter, -apple-system, Roboto, Helvetica, Arial, sans-serif;
        background: #F1F4F7; color: #1F2933;
      }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
      }
      :focus-visible { outline: 2px solid #0F2B5B; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
